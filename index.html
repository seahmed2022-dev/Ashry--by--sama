        :root { --primary: #d81b60; --bg: #fff5f8; }

        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); margin-bottom: 5px; }
        .cart-bar { background: #fff; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 160px; object-fit: contain; background: #fafafa; border-radius: 8px; margin-bottom: 8px; }
        .price { color: var(--primary); font-weight: bold; margin: 5px 0; font-size: 1.1rem; }
        button { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
        button:hover { opacity: 0.9; }
        
        #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: right; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>

let cart = [];

function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map((p, index) => `
        <div class="card">
            <div>
                <img src="${p.img}" alt="${p.name}">
                <h4 style="margin: 5px 0; font-size: 13px;">${p.name}</h4>
            </div>
            <div>
                <p class="price">${p.price} EGP</p>
                <button onclick="addToCart(${index})">إضافة إلى السلة</button>
            </div>
        </div>
    `).join('');
}

function addToCart(index) {
    cart.push(products[index]);
    document.getElementById('cartCount').innerText = cart.length;
    alert('تمت إضافة المنتج إلى السلة بنجاح!');
}

function openCheckout() {
    if(cart.length === 0) {
        alert('السلة فارغة حالياً!');
        return;
    }
    document.getElementById('orderModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
}

function sendToWhatsApp() {
    const name = document.getElementById('custName').value;
    const address = document.getElementById('custAddress').value;
    
    if(!name || !address) {
        alert('يرجى إدخال الاسم والعنوان');
        return;
    }

    let message = `مرحباً، أريد إتمام الطلب الآتي:\n\n*الاسم:* ${name}\n*العنوان:* ${address}\n\n*المنتجات المطلوبة:*\n`;
    let total = 0;
    
    cart.forEach((item, idx) => {
        message += `${idx + 1}. ${item.name} - ${item.price} EGP\n`;
        total += item.price;
    });

    message += `\n*الإجمالي الكلي:* ${total} EGP`;

    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me/200133012749?text=${encodedMessage}`, '_blank');
}

renderProducts();

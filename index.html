<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashry by سَمَا 🌸</title>
    <!-- مكتبة الأيقونات لتصميم أنيق بدون صور -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-pink: #ff4081;
            --soft-pink: #f8bbd0;
            --light-bg-pink: #fff0f5;
            --dark-pink-text: #880e4f;
            --card-bg: #ffffff;
            --whatsapp-green: #25d366;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg-pink);
            color: #333;
            padding: 20px;
            direction: rtl;
            padding-bottom: 80px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #fce4ec 100%);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.1);
            border: 2px solid var(--soft-pink);
        }

        .main-title {
            color: var(--primary-pink);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--dark-pink-text);
            font-size: 1.1rem;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 8px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.2);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.08);
            border: 1.5px solid var(--soft-pink);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.2);
            border-color: var(--primary-pink);
        }

        .product-image-box {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #fff 0%, #fce4ec 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--soft-pink);
            color: var(--primary-pink);
            font-size: 3rem;
        }

        .product-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-category {
            font-size: 0.75rem;
            color: var(--dark-pink-text);
            font-weight: 600;
        }

        .product-title {
            font-size: 1rem;
            margin: 6px 0;
            font-weight: 700;
            color: #333;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--primary-pink);
            font-weight: bold;
            margin-top: 8px;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 450px;
            width: 100%;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid var(--soft-pink);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--light-bg-pink);
            border: none;
            font-size: 1.2rem;
            color: var(--primary-pink);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 25px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }

        .btn-wa { background: var(--whatsapp-green); color: white; }
        .btn-web { background: var(--primary-pink); color: white; }

        .order-form {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--soft-pink);
        }

        .order-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--soft-pink);
            border-radius: 8px;
            font-family: inherit;
        }

        .btn-submit {
            background: var(--dark-pink-text);
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        /* أيقونة الواتساب العائمة مثبتة على اليمين بالأسفل */
        .floating-wa-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--whatsapp-green);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-decoration: none;
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .floating-wa-btn:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">Ashry by سَمَا 🌸</h1>
        <h2 class="subtitle">مندوب معتمد لبراند عشري</h2>
    </header>

    <div class="controls">
        <button class="filter-btn active" onclick="filterProducts('all', event)">الكل</button>
        <button class="filter-btn" onclick="filterProducts('Skin Care', event)">العناية بالبشرة</button>
        <button class="filter-btn" onclick="filterProducts('Hair Care', event)">العناية بالشعر</button>
        <button class="filter-btn" onclick="filterProducts('Raw Products', event)">الزيوت والمواد الخام</button>
        <button class="filter-btn" onclick="filterProducts('Organic Soaps', event)">الصابون الطبيعي</button>
        <button class="filter-btn" onclick="filterProducts('Lips Care', event)">العناية بالشفاه</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<div class="modal-overlay" id="productModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h3 id="modalTitle" style="color: var(--dark-pink-text); margin-bottom: 8px;"></h3>
        <p id="modalPrice" style="color: var(--primary-pink); font-weight: bold; font-size: 1.2rem; margin-bottom: 15px;"></p>

        <a id="modalWaBtn" href="#" target="_blank" class="btn-action btn-wa">طلب عبر الواتساب <i class="fab fa-whatsapp"></i></a>
        <button class="btn-action btn-web" onclick="toggleForm()">طلب مباشر من الويب سايت 🛒</button>

        <form id="webForm" class="order-form" onsubmit="submitOrder(event)">
            <input type="text" id="custName" placeholder="الاسم بالكامل" required>
            <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
            <input type="text" id="custAddress" placeholder="العنوان التفصيلي" required>
            <button type="submit" class="btn-submit">تأكيد الطلب</button>
        </form>
    </div>
</div>

<!-- زر الواتساب العائم بالأسفل مدمج به رقمك مباشرة -->
<a href="https://wa.me/201033012749?text=مرحباً%20سما،%20عايزة%20أستفسر%20عن%20منتجات%20عشري" class="floating-wa-btn" target="_blank" title="تواصل معنا عبر الواتساب">
    <i class="fab fa-whatsapp"></i>
</a>

<script>
// رقم الواتساب المباشر الخاص بكِ بالصيغة الدولية
const myPhoneNumber = "201033012749"; 

const categoryIcons = {
    "Skin Care": "fa-sparkles",
    "Hair Care": "fa-pump-soap",
    "Raw Products": "fa-bottle-droplet",
    "Organic Soaps": "fa-soap",
    "Lips Care": "fa-heart"
};

const productsList = [
    { id: 1, name: "غسول الوجه بالجزر", price: 250, category: "Skin Care", image: "" },
    { id: 2, name: "مزيل عرق للتفتيح", price: 200, category: "Skin Care", image: "" },
    { id: 3, name: "كريم ترطيب اليدين", price: 225, category: "Skin Care", image: "" },
    { id: 4, name: "سيرم الهيالورونيك", price: 450, category: "Skin Care", image: "" },
    { id: 5, name: "بادي يوجرت برائحة جوز الهند", price: 250, category: "Skin Care", image: "" },
    
    { id: 6, name: "شامبو الشعر", price: 275, category: "Hair Care", image: "" },
    { id: 7, name: "بلسم الشعر", price: 275, category: "Hair Care", image: "" },
    { id: 8, name: "الوصفه النوبيه", price: 425, category: "Hair Care", image: "" },
    { id: 9, name: "وصفة كارما", price: 425, category: "Hair Care", image: "" },

    { id: 10, name: "زيت الروزماري المقطر", price: 350, category: "Raw Products", image: "" },
    { id: 11, name: "ماء الروزماري", price: 125, category: "Raw Products", image: "" },
    { id: 12, name: "زيت الارجان المغربي", price: 350, category: "Raw Products", image: "" },

    { id: 13, name: "صابون نوبي بالكركدية", price: 275, category: "Organic Soaps", image: "" },
    { id: 14, name: "صابونة الفحم", price: 150, category: "Organic Soaps", image: "" },

    { id: 15, name: "مرطب الشفاه", price: 125, category: "Lips Care", image: "" },
    { id: 16, name: "مقشر الشفاه", price: 100, category: "Lips Care", image: "" }
];

let selectedProduct = null;

function displayProducts(products) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';

    products.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(p);

        const imageContent = p.image && p.image.trim() !== "" 
            ? `<img src="${p.image}" alt="${p.name}">` 
            : `<i class="fa-solid ${categoryIcons[p.category] || 'fa-spa'}"></i>`;

        card.innerHTML = `
            <div class="product-image-box">
                ${imageContent}
            </div>
            <div class="product-info">
                <div>
                    <div class="product-category">${p.category}</div>
                    <div class="product-title">${p.name}</div>
                </div>
                <div class="product-price">${p.price} EGP</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openModal(product) {
    selectedProduct = product;
    document.getElementById('modalTitle').innerText = product.name;
    document.getElementById('modalPrice').innerText = product.price + " EGP";

    // رابط مباشر يفتح المحادثة معكِ ومعها اسم المنتج وسعره جاهزين
    const msg = encodeURIComponent(`مرحباً سما، أود طلب: ${product.name} بسعر ${product.price} ج.م`);
    document.getElementById('modalWaBtn').href = `https://wa.me/${myPhoneNumber}?text=${msg}`;

    document.getElementById('webForm').style.display = 'none';
    document.getElementById('productModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
}

function toggleForm() {
    const form = document.getElementById('webForm');
    form.style.display = form.style.display === 'block' ? 'none' : 'block';
}

function submitOrder(e) {
    e.preventDefault();
    const name = document.getElementById('custName').value;
    alert(`تم استلام طلبك لمنتج (${selectedProduct.name}) بنجاح يا ${name}! وسنتواصل معكِ فوراً.`);
    closeModal();
}

function filterProducts(category, evt) {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    if (evt && evt.target) evt.target.classList.add('active');

    if (category === 'all') {
        displayProducts(productsList);
    } else {
        const filtered = productsList.filter(p => p.category === category);
        displayProducts(filtered);
    }
}

window.addEventListener('DOMContentLoaded', () => displayProducts(productsList));
</script>

</body>
</html>

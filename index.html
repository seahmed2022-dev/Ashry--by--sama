let products = JSON.parse(localStorage.getItem('myStoreProductsCorrect')) || initialProducts;

function render() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map((p, index) => `
        <div class="product-card" onclick="openModal(${index})">
            <div>
                ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div style="height:180px; background:#fce4ec; display:flex; align-items:center; justify-content:center; border-radius:10px; margin-bottom:10px; color:#d81b60; font-size:14px;">بدون صورة</div>`}
                <h3>${p.name}</h3>
            </div>
            <div>
                <p class="price">${p.price} EGP</p>
                <span style="font-size: 12px; color: ${p.inStock ? 'green' : 'red'}; font-weight: bold;">
                    ${p.inStock ? 'متوفر' : 'غير متوفر'}
                </span>
            </div>
        </div>
    `).join('');
}

function accessAdmin() {
    let pass = prompt("أدخلي كلمة السر الخاصة بالتعديل:");
    if (pass === "1234") {
        const panel = document.getElementById('adminPanel');
        panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    } else if (pass !== null) {
        alert("كلمة السر غير صحيحة!");
    }
}

function updateProduct() {
    const name = document.getElementById('targetName').value.trim();
    const img = document.getElementById('targetImg').value.trim();
    const inStock = document.getElementById('targetStock').value === 'true';

    const prod = products.find(p => p.name === name);
    if (prod) {
        prod.image = img;
        prod.inStock = inStock;
        localStorage.setItem('myStoreProductsCorrect', JSON.stringify(products));
        render();
        alert("تم تحديث المنتج بنجاح!");
    } else {
        alert("اسم المنتج غير متطابق، تأكدي من كتابته تماماً كما هو في القائمة.");
    }
}

function openModal(index) {
    const p = products[index];
    document.getElementById('modalName').innerText = p.name;
    document.getElementById('modalPrice').innerText = p.price + " EGP";
    
    const stockEl = document.getElementById('modalStock');
    stockEl.innerText = p.inStock ? "الحالة: متوفر ✅" : "الحالة: غير متوفر ❌";
    stockEl.style.color = p.inStock ? "green" : "red";

    const imgContainer = document.getElementById('modalImgContainer');
    if (p.image) {
        imgContainer.innerHTML = `<img src="${p.image}" alt="${p.name}">`;
    } else {
        imgContainer.innerHTML = `<div style="height:200px; background:#fce4ec; display:flex; align-items:center; justify-content:center; border-radius:10px; margin-bottom:15px; color:#d81b60;">لا توجد صورة مضافة بعد</div>`;
    }

    document.getElementById('productModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
}

render();

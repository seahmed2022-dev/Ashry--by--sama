        body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        .cart-bar { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 900; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: center; }
        .price { color: var(--primary); font-weight: bold; margin: 8px 0; }
        button { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background: white; padding: 20px; border-radius: 15px; width: 90%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>

function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map((p, i) => `
        <div class="card">
            <h4 style="height:40px;">${p.name}</h4>
            <p class="price">${p.price} EGP</p>
            <button onclick="addToCart(${i})" ${p.inStock ? '' : 'disabled'}>
                ${p.inStock ? 'إضافة للسلة' : 'غير متوفر'}
            </button>
        </div>
    `).join('');
}
function addToCart(i) { cart.push(products[i]); document.getElementById('cartCount').innerText = cart.length; alert('تمت الإضافة!'); }
function openCheckout() { if(cart.length==0) return alert('السلة فارغة'); document.getElementById('orderModal').style.display='flex'; }
function closeModal() { document.getElementById('orderModal').style.display='none'; }
function sendToWhatsApp() {
    let msg = "طلب جديد:\n"; cart.forEach(p => msg += p.name + "\n");
    window.open(`https://wa.me/201033012749?text=${encodeURIComponent(msg)}`, '_blank');
}
renderProducts();

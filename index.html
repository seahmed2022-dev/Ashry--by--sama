<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ashry by سَمَا | إدارة المتجر</title>
    <style>
        body { font-family: sans-serif; background: #fff5f8; padding: 20px; }
        .admin-panel { background: #fff; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 2px solid #d81b60; display: none; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; }
        .price { color: #d81b60; font-weight: bold; }
        button { background: #d81b60; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

<!-- زر لفتح لوحة التحكم -->
<button onclick="document.querySelector('.admin-panel').style.display='block'">⚙️ إعدادات المتجر (للتعديل)</button>

<div class="admin-panel">
    <h3>إضافة صورة لمنتج موجود</h3>
    <input type="text" id="targetName" placeholder="اكتبي اسم المنتج بالظبط">
    <input type="text" id="targetImg" placeholder="رابط الصورة">
    <button onclick="updateImage()">حفظ الصورة للمنتج</button>
</div>

<div class="grid" id="productGrid"></div>

<script>
// قائمة المنتجات الأصلية بالأسعار

    { name: "زيت جنين القمح", price: 125 }, { name: "كريم ترطيب اليدين", price: 225 },
    { name: "كيس مخده ساتان", price: 200 }, { name: "مرطب القدم", price: 200 },
    { name: "بادي يوجرت جوز الهند", price: 250 }, { name: "زبدة الجسم جوز الهند", price: 275 },
    { name: "ماء الروزماري", price: 125 }, { name: "مزيل عرق بدون رائحة", price: 250 },
    { name: "سيروم الاظافر", price: 200 }, { name: "ماء النعناع", price: 100 },
    { name: "زيت القرع", price: 125 }, { name: "زيت بذور العنب", price: 225 },
    { name: "توكه ساتان", price: 75 }, { name: "مشط خشبي", price: 100 },
    { name: "صابونة الاعشاب", price: 150 }, { name: "بادي يوجرت الخوخ", price: 250 },
    { name: "زيت السمسم", price: 120 }, { name: "ماء الليمون", price: 125 },
    { name: "زيت الكركديه", price: 150 }, { name: "شامبو الاطفال", price: 275 },
    { name: "زيت اللوز الحلو", price: 150 }, { name: "بادي يوجرت روز فانيلا", price: 250 },
    { name: "زيت الخروع", price: 120 }, { name: "مقشر الشفاه", price: 100 },
    { name: "واقى الشمس", price: 400 }, { name: "زيت الافوكادو", price: 125 },
    { name: "زيت الارجان المغربي", price: 350 }, { name: "فرشاة الشعر بامبو", price: 250 },
    { name: "زيت القهوة", price: 150 }, { name: "ماء اللافندر", price: 125 },
    { name: "تنت كريمي", price: 175 }, { name: "فوطه مايكروفايبر", price: 250 },
    { name: "زبدة الشيا", price: 200 }, { name: "زيت الورد", price: 150 },
    { name: "زيت الجرجير", price: 120 }, { name: "قناع الطمي الاسواني", price: 250 },
    { name: "صابونة الشيا وجوز الهند", price: 150 }, { name: "صابون مغربي", price: 225 },
    { name: "مرطب الشفاه", price: 125 }, { name: "مقشر القهوه", price: 250 },
    { name: "لوفه مغربي", price: 175 }, { name: "سيرم حب الشباب", price: 225 },
    { name: "الحنه النوبيه", price: 225 }, { name: "بادي يوجرت Sexy Graffiti", price: 250 },
    { name: "صابونة الكركديه", price: 150 }, { name: "واقى الشمس Sun Block", price: 250 },
    { name: "زيت السعد", price: 225 }, { name: "زيت الجوجوبا", price: 150 },
    { name: "صابونة الفحم", price: 150 }, { name: "صابونة القهوه", price: 150 },
    { name: "سيرم الهيالورونيك", price: 450 }, { name: "جيل الصبار", price: 200 },
    { name: "كريم الكولاجين", price: 250 }, { name: "سيرم الرموش", price: 200 },
    { name: "بلسم الشعر", price: 275 }, { name: "الوصفه النوبيه", price: 425 },
    { name: "وصفة كارما", price: 425 }, { name: "غسول الوجه بالجزر", price: 250 },
    { name: "شامبو الشعر", price: 275 }, { name: "كريم مرطب سوفت اند جلو", price: 250 },
    { name: "سبراي كارما مقوي للشعر", price: 325 }, { name: "مزيل عرق اكسترا", price: 250 },
    { name: "سبراي كارما تونيك اكسترا", price: 450 }, { name: "مزيل عرق للتفتيح", price: 200 },
    { name: "تنت ملون الشفاه والخدود", price: 100 }
];

let products = JSON.parse(localStorage.getItem('myStore')) || initialProducts;

function render() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(p => `
        <div class="card">
            ${p.image ? `<img src="${p.image}">` : `<div style="height:180px; background:#eee; display:flex; align-items:center; justify-content:center;">بدون صورة</div>`}
            <h3>${p.name}</h3>
            <p class="price">${p.price} EGP</p>
        </div>
    `).join('');
}

function updateImage() {
    const name = document.getElementById('targetName').value;
    const img = document.getElementById('targetImg').value;
    const prod = products.find(p => p.name === name);
    if(prod) {
        prod.image = img;
        localStorage.setItem('myStore', JSON.stringify(products));
        render();
    } else {
        alert("الاسم غير موجود، تأكدي من كتابته بدقة");
    }
}

render();
</script>
</body>
</html>

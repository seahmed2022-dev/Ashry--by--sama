<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashry by سَمَا</title>
    <style>
        :root {
            --primary-pink: #ff4081;
            --soft-pink: #f8bbd0;
            --light-bg-pink: #fff0f5;
            --card-pink-border: #f8bbd0;
            --dark-pink-text: #880e4f;
            --card-bg: #ffffff;
            --out-of-stock: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg-pink);
            color: #333;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 25px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #fce4ec 100%);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.1);
            border: 2px solid var(--soft-pink);
        }

        .main-title {
            color: var(--primary-pink);
            font-size: 2.3rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--dark-pink-text);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .sync-info {
            font-size: 0.85rem;
            color: #777;
            background-color: #fff;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px dashed var(--primary-pink);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1.5px solid var(--card-pink-border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.2);
            border-color: var(--primary-pink);
        }

        .product-image-wrapper {
            width: 100%;
            height: 200px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--soft-pink);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--dark-pink-text);
            font-weight: 600;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.05rem;
            margin: 8px 0;
            font-weight: 700;
            color: #222;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--primary-pink);
            font-weight: 800;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 2;
        }

        .in-stock {
            background-color: rgba(232, 245, 233, 0.95);
            color: #2e7d32;
        }

        .out-of-stock {
            background-color: rgba(255, 235, 238, 0.95);
            color: var(--out-of-stock);
        }

        /* نافذة التفاصيل Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid var(--soft-pink);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--light-bg-pink);
            border: none;
            font-size: 1.2rem;
            color: var(--primary-pink);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: var(--dark-pink-text);
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .modal-desc {
            color: #555;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .modal-price {
            font-size: 1.4rem;
            color: var(--primary-pink);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .order-btn {
            display: block;
            width: 100%;
            text-align: center;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s ease;
        }

        .order-btn:hover {
            background-color: #128c7e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">Ashry by سَمَا 🌸</h1>
        <h2 class="subtitle">مندوب معتمد لبراند عشري</h2>
        <div class="sync-info">اضغطي على أي منتج لعرض التفاصيل الكاملة ✨</div>
    </header>

    <div class="controls">
        <button class="filter-btn active" onclick="filterProducts('all', event)">الكل</button>
        <button class="filter-btn" onclick="filterProducts('Skin Care', event)">العناية بالبشرة</button>
        <button class="filter-btn" onclick="filterProducts('Hair Care', event)">العناية بالشعر</button>
        <button class="filter-btn" onclick="filterProducts('Raw Products', event)">الزيوت والمواد الخام</button>
        <button class="filter-btn" onclick="filterProducts('Organic Soaps', event)">الصابون الطبيعي</button>
        <button class="filter-btn" onclick="filterProducts('Lips Care', event)">العناية بالشفاه</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- النافذة المنبثقة للتفاصيل -->
<div class="modal-overlay" id="productModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <img id="modalImg" src="" class="modal-img">
        <h3 id="modalTitle" class="modal-title"></h3>
        <p id="modalDesc" class="modal-desc"></p>
        <div id="modalPrice" class="modal-price"></div>
        <a id="modalOrder" href="#" target="_blank" class="order-btn">طلب المنتج عبر الواتساب 💬</a>

</div>

    { name: "زيت الجوجوبا - Jojoba Oil", price: 150, category: "Raw Products", inStock: true, desc: "زيت خفيف سريع الامتصاص يوازن إفراز دهون البشرة والشعر." },

    { name: "مرطب الشفاه - Lip Balm", price: 125, category: "Lips Care", inStock: true, desc: "ترطيب وتغذية الشفاه وحمايتها من الجفاف والتشقق." },
    { name: "مقشر الشفاه - Lip Scrub", price: 100, category: "Lips Care", inStock: true, desc: "يزيل الخلايا الميتة بلطف لشفاه ناعمة ووردي طبيعي." }

let globalProducts = rawProductsList;

function displayProducts(products) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';

    products.forEach((product, index) => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(product);

        const imgUrl = product.image || defaultImages[product.category] || defaultImages["Skin Care"];
        const statusClass = product.inStock ? 'in-stock' : 'out-of-stock';
        const statusText = product.inStock ? 'متوفر' : 'غير متوفر';

        card.innerHTML = `
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div class="product-image-wrapper">
                <img src="${imgUrl}" alt="${product.name}" class="product-image">
            </div>
            <div class="product-info">
                <div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-title">${product.name}</div>
                </div>
                <div class="product-price">${product.price} EGP</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openModal(product) {
    const imgUrl = product.image || defaultImages[product.category] || defaultImages["Skin Care"];
    document.getElementById('modalImg').src = imgUrl;
    document.getElementById('modalTitle').innerText = product.name;
    document.getElementById('modalDesc').innerText = product.desc;
    document.getElementById('modalPrice').innerText = product.price + " EGP";
    
    // رابط طلب الواتساب المباشر
    const message = encodeURIComponent(`مرحباً سما، أود طلب: ${product.name} بسعر ${product.price} ج.م`);
    document.getElementById('modalOrder').href = `https://wa.me/?text=${message}`;

    document.getElementById('productModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
}

function filterProducts(category, evt) {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    if (evt && evt.target) evt.target.classList.add('active');

    if (category === 'all') {
        displayProducts(globalProducts);
    } else {
        const filtered = globalProducts.filter(p => p.category === category);
        displayProducts(filtered);
    }
}

window.addEventListener('DOMContentLoaded', () => displayProducts(globalProducts));
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Ashry by سَمَا | متجر المنتجات الطبيعية</title>
    <style>
        :root { --primary: #d81b60; --bg: #fff5f8; }
        body { font-family: Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); margin-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 12px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        .price { color: var(--primary); font-weight: bold; margin: 5px 0; font-size: 1.1rem; }
        button { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
        button:hover { opacity: 0.9; }
        
        #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: right; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>
<body>

</header>

            <input type="hidden" name="product_name" id="modalProdName">
            <label>المنتج المطلوب:</label>
            <input type="text" id="displayProdName" readonly style="background:#f4f4f4; font-weight:bold;">
            <label>اسمك الكريم:</label>
            <input type="text" name="customer_name" placeholder="أدخلي اسمك الكامل" required>
            <label>رقم الموبايل / الواتساب:</label>
            <input type="text" name="customer_phone" placeholder="أدخلي رقم التواصل" required>
            <label>العنوان بالتفصيل:</label>
            <input type="text" name="customer_address" placeholder="المدينة، المنطقة، الشارع" required>
            <button type="submit" style="margin-top: 10px;">إرسال الطلب</button>

function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map(p => `
        <div class="card">
            <div>
                <img src="https://images.unsplash.com/photo-1556228720-195a672e8a03?w=300" alt="${p.name}">
                <h4 style="margin: 5px 0; font-size: 13px;">${p.name}</h4>

            <div>

                <button onclick="openOrderModal('${p.name.replace(/'/g, "\\'")}')">طلب المنتج</button>
            </div>
        </div>
    `).join('');
}

function openOrderModal(productName) {
    document.getElementById('modalProdName').value = productName;

function closeModal() {

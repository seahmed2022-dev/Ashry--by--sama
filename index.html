        header { text-align: center; margin-bottom: 25px; }
        header h1 { color: var(--primary); margin-bottom: 5px; }
        .cart-bar { background: #fff; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .price { color: var(--primary); font-weight: bold; margin: 8px 0; font-size: 1.1rem; }
        
        .stock-status { font-size: 12px; font-weight: bold; margin-bottom: 8px; padding: 3px 8px; border-radius: 4px; display: inline-block; }
        .in-stock { background: #e8f5e9; color: #2e7d32; }
        .out-stock { background: #ffebee; color: #c62828; }

        button { background: var(--primary); color: white; border: none; padding: 9px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        
        .whatsapp-float {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background-color: #25d366;
            color: white;
            border-radius: 50px;
            padding: 12px 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            font-weight: bold;
            z-index: 1000;
            font-size: 14px;
        }
        .whatsapp-float:hover { background-color: #20ba5a; }

        #orderModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 15px; width: 90%; max-width: 400px; text-align: right; box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .modal-content input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    </style>
</head>

function renderProducts() {
    const grid = document.getElementById('productGrid');
    grid.innerHTML = products.map((p, index) => `
        <div class="card">
            <div>
                <h4 style="margin: 5px 0 8px 0; font-size: 15px; color: #333;">${p.name}</h4>
                <span class="stock-status ${p.inStock ? 'in-stock' : 'out-stock'}">
                    ${p.inStock ? 'متوفر' : 'غير متوفر'}
                </span>
            </div>
            <div>
                <p class="price">${p.price} EGP</p>
                <button onclick="addToCart(${index})" ${p.inStock ? '' : 'disabled'}>
                    ${p.inStock ? 'إضافة إلى السلة' : 'غير متوفر'}
                </button>
            </div>
        </div>
    `).join('');
}

function addToCart(index) {
    if (!products[index].inStock) return;
    cart.push(products[index]);
    document.getElementById('cartCount').innerText = cart.length;
    alert('تمت إضافة المنتج إلى السلة بنجاح!');
}

function openCheckout() {
    if(cart.length === 0) {
        alert('السلة فارغة حالياً!');
        return;
    }
    document.getElementById('orderModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('orderModal').style.display = 'none';
}

function sendToWhatsApp() {
    const name = document.getElementById('custName').value;
    const address = document.getElementById('custAddress').value;
    
    if(!name || !address) {
        alert('يرجى إدخال الاسم والعنوان');
        return;
    }

    let message = `مرحباً، أريد إتمام الطلب الآتي:\n\n*الاسم:* ${name}\n*العنوان:* ${address}\n\n*المنتجات المطلوبة:*\n`;
    let total = 0;
    
    cart.forEach((item, idx) => {
        message += `${idx + 1}. ${item.name} - ${item.price} EGP\n`;
        total += item.price;
    });

    message += `\n*الإجمالي الكلي:* ${total} EGP`;

    const encodedMessage = encodeURIComponent(message);
    window.open(`https://wa.me/201033012749?text=${encodedMessage}`, '_blank');
}

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ashry by سَمَا</title>
    <style>
        :root {
            --primary-pink: #ff4081;
            --soft-pink: #f8bbd0;
            --light-bg-pink: #fff0f5;
            --card-pink-border: #f8bbd0;
            --dark-pink-text: #880e4f;
            --card-bg: #ffffff;
            --out-of-stock: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg-pink);
            color: #333;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
            padding: 25px 20px;
            background: linear-gradient(135deg, #ffffff 0%, #fce4ec 100%);
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.1);
            border: 2px solid var(--soft-pink);
        }

        .main-title {
            color: var(--primary-pink);
            font-size: 2.3rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .subtitle {
            color: var(--dark-pink-text);
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .sync-info {
            font-size: 0.85rem;
            color: #777;
            background-color: #fff;
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px dashed var(--primary-pink);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-pink);
            color: var(--primary-pink);
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-pink);
            color: white;
            box-shadow: 0 4px 12px rgba(255, 64, 129, 0.3);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1.5px solid var(--card-pink-border);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(255, 64, 129, 0.2);
            border-color: var(--primary-pink);
        }

        .product-image-wrapper {
            width: 100%;
            height: 220px;
            background-color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--soft-pink);
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-category {
            font-size: 0.8rem;
            color: var(--dark-pink-text);
            font-weight: 600;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 1.05rem;
            margin: 8px 0;
            font-weight: 700;
            color: #222;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--primary-pink);
            font-weight: 800;
        }

        .status-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            z-index: 2;
        }

        .in-stock {
            background-color: rgba(232, 245, 233, 0.95);
            color: #2e7d32;
        }

        .out-of-stock {
            background-color: rgba(255, 235, 238, 0.95);
            color: var(--out-of-stock);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            padding: 25px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            border: 2px solid var(--soft-pink);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--light-bg-pink);
            border: none;
            font-size: 1.2rem;
            color: var(--primary-pink);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .modal-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: var(--dark-pink-text);
            font-size: 1.3rem;
            margin-bottom: 8px;
        }

        .modal-price {
            font-size: 1.3rem;
            color: var(--primary-pink);
            font-weight: 800;
            margin-bottom: 15px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-whatsapp {
            display: block;
            text-align: center;
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        .btn-web-order {
            background-color: var(--primary-pink);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            width: 100%;
        }

        .web-form {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed var(--soft-pink);
        }

        .web-form input, .web-form textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--soft-pink);
            border-radius: 8px;
            font-family: inherit;
        }

        .submit-order-btn {
            background-color: var(--dark-pink-text);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 class="main-title">Ashry by سَمَا 🌸</h1>
        <h2 class="subtitle">مندوب معتمد لبراند عشري</h2>
        <div class="sync-info">اضغطي على أي منتج لعرض التفاصيل وتحديد طريقة الطلب ✨</div>
    </header>

    <div class="controls">
        <button class="filter-btn active" onclick="filterProducts('all', event)">الكل</button>
        <button class="filter-btn" onclick="filterProducts('Skin Care', event)">العناية بالبشرة</button>
        <button class="filter-btn" onclick="filterProducts('Hair Care', event)">العناية بالشعر</button>
        <button class="filter-btn" onclick="filterProducts('Raw Products', event)">الزيوت والمواد الخام</button>
        <button class="filter-btn" onclick="filterProducts('Organic Soaps', event)">الصابون الطبيعي</button>
        <button class="filter-btn" onclick="filterProducts('Lips Care', event)">العناية بالشفاه</button>
    </div>

    <div class="products-grid" id="productsGrid"></div>
</div>

<!-- Modal Dialog -->
<div class="modal-overlay" id="productModal">
    <div class="modal-content">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <img id="modalImg" src="" class="modal-img" alt="صورة المنتج">
        <h3 id="modalTitle" class="modal-title"></h3>
        <div id="modalPrice" class="modal-price"></div>

        <div class="action-buttons">
            <a id="modalWhatsapp" href="#" target="_blank" class="btn-whatsapp">طلب عبر الواتساب 💬</a>
            <button class="btn-web-order" onclick="toggleWebForm()">الطلب المباشر من الويب سايت 🛒</button>
        </div>

        <form id="webForm" class="web-form" onsubmit="handleFormSubmit(event)">
            <input type="text" id="custName" placeholder="الاسم بالكامل" required>
            <input type="tel" id="custPhone" placeholder="رقم الهاتف" required>
            <textarea id="custAddress" placeholder="العنوان التفصيلي للشحن" rows="2" required></textarea>
            <button type="submit" class="submit-order-btn">تأكيد الطلب الآن</button>
        </form>
    </div>
</div>

<script>
const rawProductsList = [
    { name: "غسول الوجه بالجزر - Facial Cleanser with Carrot", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Carrot-Facial-Cleanser.jpg" },
    { name: "مزيل عرق للتفتيح - Whitening Deodorant", price: 200, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Deodorant.jpg" },
    { name: "مزيل عرق اكسترا - Extra Whitening Deodorant", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Extra-Deodorant.jpg" },
    { name: "مزيل عرق بدون رائحة - Unscented Deodorant", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Unscented-Deodorant.jpg" },
    { name: "سيرم الهيالورونيك - Hyaluronic Acid Serum", price: 450, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Hyaluronic-Acid.jpg" },
    { name: "سيرم حب الشباب - Acne Serum", price: 225, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Acne-Serum.jpg" },
    { name: "كريم ترطيب اليدين - Hand Cream", price: 225, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Hand-Cream.jpg" },
    { name: "كريم مرطب سوفت اند جلو - Soft and glow Cream", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Soft-and-Glow.jpg" },
    { name: "كريم الكولاجين - Collagen Cream", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Collagen-Cream.jpg" },
    { name: "مرطب القدم - Foot Balm", price: 200, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Foot-Balm.jpg" },
    { name: "بادي يوجرت برائحة جوز الهند - Body Yogurt Naughty Coconut", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Body-Yogurt-Coconut.jpg" },
    { name: "بادي يوجرت برائحة الخوخ - Body Yogurt Fresh Peach", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Body-Yogurt-Peach.jpg" },
    { name: "بادي يوجرت برائحة الروز فانيلا - Body Yogurt Rose Vanilla", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Body-Yogurt-Rose-Vanilla.jpg" },
    { name: "زبدة الجسم برائحة جوز الهند - Body Butter Coconut", price: 275, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Body-Butter.jpg" },
    { name: "مقشر القهوه - Coffee Scrub", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Coffee-Scrub.jpg" },
    { name: "واقى الشمس - Sun Block", price: 250, category: "Skin Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Sunblock.jpg" },

    { name: "شامبو الشعر - Hair Shampoo", price: 275, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Hair-Shampoo.jpg" },
    { name: "بلسم الشعر - Hair Conditioner", price: 275, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Hair-Conditioner.jpg" },
    { name: "شامبو الاطفال - Kids Shampoo", price: 275, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Kids-Shampoo.jpg" },
    { name: "الوصفه النوبيه - Nubian Recipe", price: 425, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Nubian-Recipe.jpg" },
    { name: "وصفة كارما - Karma Recipe", price: 425, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Karma-Recipe.jpg" },
    { name: "سبراي كارما مقوي للشعر - Karma Tonic Spray", price: 325, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Karma-Spray.jpg" },
    { name: "جيل الصبار - Aleo Vera gel", price: 200, category: "Hair Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Aloe-Vera.jpg" },

    { name: "زيت الروزماري المقطر - Rosemary Essential Oil", price: 350, category: "Raw Products", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Rosemary-Essential-Oil.jpg" },
    { name: "ماء الروزماري - Rosemary Water", price: 125, category: "Raw Products", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Rosemary-Water.jpg" },
    { name: "زيت الارجان المغربي - Moroccan Argan Oil", price: 350, category: "Raw Products", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Argan-Oil.jpg" },

    { name: "صابون نوبي بالكركدية - Nubian Soap With Hibiscus", price: 275, category: "Organic Soaps", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Nubian-Soap.jpg" },
    { name: "صابونة الفحم - Charcoal Soap", price: 150, category: "Organic Soaps", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Charcoal-Soap.jpg" },

    { name: "مرطب الشفاه - Lip Balm", price: 125, category: "Lips Care", inStock: true, image: "https://ashrynatural.com/wp-content/uploads/2023/10/Lip-Balm.jpg" }
];

let selectedProduct = null;

function displayProducts(products) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';

    products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openModal(product);

        const statusClass = product.inStock ? 'in-stock' : 'out-of-stock';
        const statusText = product.inStock ? 'متوفر' : 'غير متوفر';

        card.innerHTML = `
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div class="product-image-wrapper">
                <img src="${product.image}" alt="${product.name}" class="product-image">
            </div>
            <div class="product-info">
                <div>
                    <div class="product-category">${product.category}</div>
                    <div class="product-title">${product.name}</div>
                </div>
                <div class="product-price">${product.price} EGP</div>
            </div>
        `;
        grid.appendChild(card);
    });
}

function openModal(product) {
    selectedProduct = product;
    document.getElementById('modalImg').src = product.image;
    document.getElementById('modalTitle').innerText = product.name;
    document.getElementById('modalPrice').innerText = product.price + " EGP";
    
    // رابط الواتساب
    const msg = encodeURIComponent(`مرحباً سما، أود طلب منتج: ${product.name} بسعر ${product.price} ج.م`);
    document.getElementById('modalWhatsapp').href = `https://wa.me/?text=${msg}`;

    document.getElementById('webForm').style.display = 'none';
    document.getElementById('productModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('productModal').style.display = 'none';
}

function toggleWebForm() {
    const form = document.getElementById('webForm');
    form.style.display = form.style.display === 'block' ? 'none' : 'block';
}

function handleFormSubmit(e) {
    e.preventDefault();
    const name = document.getElementById('custName').value;
    alert(`شكراً لكِ يا ${name}! تم تسجيل طلبك لمنتج (${selectedProduct.name}) بنجاح، وسنتواصل معكِ لتأكيد الشحن.`);
    closeModal();
}

function filterProducts(category, evt) {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    if (evt && evt.target) evt.target.classList.add('active');

    if (category === 'all') {
        displayProducts(rawProductsList);
    } else {
        const filtered = rawProductsList.filter(p => p.category === category);
        displayProducts(filtered);
    }
}

window.addEventListener('DOMContentLoaded', () => displayProducts(rawProductsList));
</script>

</body>
</html>
